<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安福路 Salomon - 兼职团队</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a1a2e;
      --primary-light: #2d2d4a;
      --accent: #e94560;
      --accent-hover: #d63851;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #e94560;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      background: linear-gradient(135deg, #1a1a2e, #2d2d4a);
      padding: 36px 28px 28px;
      text-align: center;
      position: relative;
    }

    .login-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 20px solid #2d2d4a;
    }

    .brand-icon {
      font-size: 44px;
      display: block;
      margin-bottom: 8px;
    }

    .brand-title {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      margin-top: 4px;
    }

    .login-body {
      padding: 44px 28px 32px;
      text-align: center;
    }

    .welcome-text {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #c0392b);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      letter-spacing: 1px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-msg {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    .login-msg.error { color: var(--error); }
    .login-msg.success { color: var(--success); }
    .login-msg.info { color: var(--warning); }

    .login-footer {
      text-align: center;
      padding: 0 28px 20px;
      font-size: 11px;
      color: #94a3b8;
    }

    .account-info {
      margin-top: 20px;
      padding: 14px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.8;
      text-align: left;
    }

    .account-info strong { color: var(--text-primary); }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* v155: 已移除 legacy GitHub 同步面板相关样式 */
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <span class="brand-icon">🏔️</span>
      <div class="brand-title">Salomon 安福路</div>
      <div class="brand-sub">L140 兼职团队数据平台</div>
    </div>
    <div class="login-body">
      <div class="welcome-text">兼职团队管理系统<br>请输入邮箱和密码登录</div>

      <div class="input-group">
        <label>📧 邮箱</label>
        <input type="email" id="emailInput" placeholder="拼音@salomon.temp" autocomplete="username" />
      </div>

      <div class="input-group">
        <label>🔑 密码</label>
        <input type="password" id="passwordInput" placeholder="初始密码: Salomon2026!" autocomplete="current-password" />
      </div>

      <button class="btn-login" id="btnLogin" onclick="doAuthLogin()">
        登 录
      </button>

      <div class="login-msg" id="loginMsg"></div>

      <div class="account-info">
        <strong>📋 首次登录说明：</strong><br>
        邮箱格式：<strong>姓名拼音@salomon.temp</strong><br>
        初始密码：<strong>Salomon2026!</strong><br>
        管理员：<strong>admin@salomon.temp</strong><br>
        <span style="color:#94a3b8;">登录后可在设置中修改密码</span>
      </div>

      <!-- v155: 已移除 GitHub Token 配置面板 -->
    </div>
    <div class="login-footer">
       安福路 Salomon 旗舰店 · v158
    </div>
  </div>

  <!-- Supabase config + client (必须在 auth 之前加载) -->
  <script src="supabase/config.js?v=159"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=159"></script>

  <script>
    // 回车键提交
    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doAuthLogin();
    });
    document.getElementById('emailInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('passwordInput').focus();
    });

    async function doAuthLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('btnLogin');
      const msgEl = document.getElementById('loginMsg');

      if (!email || !password) {
        msgEl.className = 'login-msg error';
        msgEl.textContent = '请填写邮箱和密码';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>登录中...';
      msgEl.className = 'login-msg info';
      msgEl.textContent = '';

      try {
        // 尝试 Supabase 登录
        if (typeof salomonSupabase !== 'undefined' && salomonSupabase.client) {
          const { data, error } = await salomonSupabase.client.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;

          // 登录成功，获取用户信息
          const { data: staffData, error: staffErr } = await salomonSupabase.client
            .from('staff')
            .select('*')
            .eq('auth_id', data.user.id)
            .single();

          // 写入 session
          sessionStorage.setItem('auth', JSON.stringify({
            authenticated: true,
            supabaseUserId: data.user.id,
            staffId: staffData?.id || null,
            staffName: staffData?.name || data.user.user_metadata?.name || email,
            dept: staffData?.dept || null,
            role: staffData?.role || data.user.user_metadata?.role || 'parttime',
            loginTime: Date.now()
          }));

          msgEl.className = 'login-msg success';
          msgEl.textContent = '✅ 登录成功！正在跳转...';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
          return;
        }

        // Supabase 未加载，降级旧模式（临时）
        throw new Error('Supabase 未初始化');

      } catch (err) {
        btn.disabled = false;
        btn.textContent = '登 录';
        msgEl.className = 'login-msg error';

        if (err.message?.includes('Invalid login')) {
          msgEl.textContent = '❌ 邮箱或密码错误';
        } else if (err.message?.includes('Email not confirmed')) {
          msgEl.textContent = '❌ 邮箱未验证，请联系管理员';
        } else if (err.message?.includes('not confirmed') || err.message?.includes('verification')) {
          // Supabase 默认开启邮箱确认，但我们用的是 .temp 域名
          // 需要在 Dashboard 关闭邮箱确认，或手动确认
          msgEl.innerHTML = '❌ 邮箱需要验证。<br>请在 Supabase Dashboard → Authentication → Users 中手动确认邮箱。<br>或在 Authentication → Providers → Email 中关闭"Confirm email"。';
        } else {
          msgEl.textContent = '❌ ' + (err.message || '登录失败');
        }
      }
    }

    // v155: 已移除旧版 GitHub 同步逻辑（toggleSyncPanel / updateSyncStatus / saveSyncToken）

    // 检查是否已登录（自动跳转）
    (async function checkExistingSession() {
      try {
        if (typeof salomonSupabase !== 'undefined' && salomonSupabase.client) {
          const { data: { session } } = await salomonSupabase.client.auth.getSession();
          if (session) {
            window.location.href = 'index.html';
          }
        }
      } catch(e) { /* 忽略，停留登录页 */ }
    })();
  </script>
</body>
</html>
