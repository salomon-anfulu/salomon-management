name: 灵工考勤自动同步

on:
  schedule:
    # 每天 22:00 北京时间（UTC 14:00）
    - cron: '0 14 * * *'
  workflow_dispatch: {} # 手动触发

permissions:
  contents: write # 需要 push 权限

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore auth state from Secret
        env:
          LINGGONG_AUTH_STATE: ${{ secrets.LINGGONG_AUTH_STATE }}
        run: |
          if [ -z "$LINGGONG_AUTH_STATE" ]; then
            echo "::warning::LINGGONG_AUTH_STATE Secret 未配置，跳过"
            echo "::notice::请在 GitHub Settings → Secrets 中配置 LINGGONG_AUTH_STATE（auth_state.json 的完整内容）"
            exit 1
          fi
          mkdir -p data
          echo "$LINGGONG_AUTH_STATE" > data/auth_state.json
          echo "✅ auth_state.json 已从 Secret 恢复"

      - name: Fetch attendance via API
        env:
          LINGGONG_AUTH_STATE: ${{ secrets.LINGGONG_AUTH_STATE }}
        run: node scripts/linggong_ci.js

      # 如果 fetch 失败（退出码 10 = token 过期），停止后续步骤
      # GitHub Actions 会自动通过邮件通知仓库 owner

      - name: Sync to app.js
        run: node scripts/sync_linggong_to_app.js

      - name: Verify syntax
        run: node -c js/app.js

      - name: Commit & push
        run: |
          git config user.name "lingong-bot"
          git config user.email "actions@github.com"
          git add data/weekly_attendance_clean.json js/app.js
          if git diff --staged --quiet; then
            echo "ℹ️ 无数据变化，跳过提交"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "data: 灵工考勤自动同步 $TODAY

          Generated by GitHub Actions CI"
            git push
            echo "✅ 已推送！GitHub Pages 将在 1-2 分钟内生效"
          fi

      - name: Save refreshed auth state to Secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/auth_state.json ]; then
            echo "ℹ️ 无 auth_state.json 可保存"
            exit 0
          fi
          # 检查 gh CLI 是否可用且 token 有 secrets 权限
          if ! command -v gh &> /dev/null; then
            echo "ℹ️ gh CLI 不可用，跳过 auth state 回写"
            exit 0
          fi
          # 将更新后的 auth_state 回写到 Secret（GITHUB_TOKEN 可能无 secrets 权限，忽略错误）
          CONTENT=$(cat data/auth_state.json | base64 -w 0)
          gh secret set LINGGONG_AUTH_STATE --body "$CONTENT" 2>/dev/null || \
            echo "ℹ️ Secret 更新跳过（GITHUB_TOKEN 默认无 secrets 写权限，需要 PAT）"
