name: 灵工考勤自动同步

on:
  schedule:
    # 每天 22:00 北京时间（UTC 14:00）
    - cron: '0 14 * * *'
  workflow_dispatch: {} # 手动触发

permissions:
  contents: write # 需要 push 权限

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Restore auth state from Secret
        env:
          LINGGONG_AUTH_STATE: ${{ secrets.LINGGONG_AUTH_STATE }}
        run: |
          if [ -z "$LINGGONG_AUTH_STATE" ]; then
            echo "::error::LINGGONG_AUTH_STATE Secret 未配置"
            echo "请在 GitHub Settings → Secrets 中配置 LINGGONG_AUTH_STATE（auth_state.json 的 base64 编码）"
            exit 1
          fi
          mkdir -p data
          # 自动检测编码：以 { 开头为纯 JSON，否则按 base64 解码
          if [ "${LINGGONG_AUTH_STATE:0:1}" = "{" ]; then
            echo "📖 检测到纯 JSON"
            echo "$LINGGONG_AUTH_STATE" > data/auth_state.json
          else
            echo "📖 检测到 base64 编码，解码中..."
            echo "$LINGGONG_AUTH_STATE" | base64 -d > data/auth_state.json
          fi
          echo "✅ auth_state.json 已恢复"
          echo "   大小: $(wc -c < data/auth_state.json) 字节"
          node -e "const d=require('./data/auth_state.json');console.log('   Cookie 数:', (d.cookies||[]).length)"

      - name: Fetch attendance via API
        run: |
          node --version
          node scripts/linggong_ci.js

      - name: Sync to app.js
        run: node scripts/sync_linggong_to_app.js

      - name: Verify syntax
        run: node -c js/app.js

      - name: Commit & push
        run: |
          git config user.name "lingong-bot"
          git config user.email "actions@github.com"
          git add data/weekly_attendance_clean.json js/app.js
          if git diff --staged --quiet; then
            echo "ℹ️ 无数据变化，跳过提交"
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "data: 灵工考勤自动同步 $TODAY

          Generated by GitHub Actions CI"
            git push
            echo "✅ 已推送！GitHub Pages 将在 1-2 分钟内生效"
          fi
