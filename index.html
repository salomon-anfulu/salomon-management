  <!-- v150 刷新风暴断路器（同步、最先执行）：检测异常连环刷新并标记，阻断探针/同步加剧死循环 -->
  <script>
    (function () {
      try {
        var KEY = '__reloadStorm__';
        var now = Date.now();
        var arr = [];
        try { arr = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch (e) {}
        arr = arr.filter(function (t) { return now - t < 8000; });
        arr.push(now);
        sessionStorage.setItem(KEY, JSON.stringify(arr));
        if (arr.length > 6) {
          window.__PANIC_SYNC__ = true;
          console.error('[PanicBreaker] 检测到刷新风暴（8秒内>' + arr.length + '次），已停用同步与探针刷新。请关闭此标签页并重新打开。');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Scripts (cache-buster: v=对应 DATA_VERSION, 每次升级 v17 时改成 v17) -->
  <!-- 注意：故意不加 defer/async。原因：后面的内联 <script> 定义了 Auth 模块，
       pages.js 的 _auth getter 和内联脚本的 Auth.init() 都依赖执行顺序。
       defer 脚本在 DOMContentLoaded 前执行，但内联脚本会立即执行 → 时序错乱。
       body 末尾 + 默认同步加载是当前架构的最可靠方案。 -->

  <!-- v130+ 强制刷新探针：在 app.js 加载前运行，确保拿到最新数据 + 注销旧 SW -->
  <script>
    (async function() {
      const LAST_SEEN_KEY = '__lastSeenDataVersion';
      const LS_LAST_REFRESH = '__lastForcedRefresh';
      try {
        // 1. 先注销所有已注册的 Service Worker（v130 强化：防止旧 SW 拦截 fetch 返回旧文件）
        if ('serviceWorker' in navigator) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              await reg.unregister();
              console.log('[VersionProbe] 已注销旧 SW:', reg.scope);
            }
          } catch (e) {
            console.warn('[VersionProbe] SW 注销失败（非致命）:', e.message);
          }
        }

        // 2. fetch version.json（绕缓存）
        const ts = Date.now();
        const resp = await fetch('version.json?_=' + ts, { cache: 'no-store' });
        if (!resp.ok) {
          console.warn('[VersionProbe] version.json 加载失败:', resp.status);
          return;
        }
        const vinfo = await resp.json();
        const latest = vinfo.dataVersion;
        const lastSeen = localStorage.getItem(LAST_SEEN_KEY);

        console.log('[VersionProbe] latest=' + latest + ' lastSeen=' + (lastSeen || 'none'));

        // 3. 首次进入或版本变化
        if (lastSeen && lastSeen === latest) {
          // 版本一致，无需动作
          return;
        }

        // 版本不一致或首次：记录并清缓存
        // 循环保护：10 秒窗口内最多 reload 1 次（避免 version.json 与代码不一致死循环）
        const lastRefresh = parseInt(localStorage.getItem(LS_LAST_REFRESH) || '0', 10);
        const now = Date.now();
        if (now - lastRefresh < 10 * 1000) {
          console.warn('[VersionProbe] 距上次刷新 <10s，跳过避免循环 reload');
          localStorage.setItem(LAST_SEEN_KEY, latest);
          return;
        }

        // 4. 清理 Service Worker 缓存（v130 强化：所有 Cache Storage）
        if ('caches' in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
            console.log('[VersionProbe] 已清理 ' + keys.length + ' 个缓存');
          } catch (e) {
            console.warn('[VersionProbe] 清缓存失败:', e.message);
          }
        }

        // 5. 记录已见到此版本 + 强制刷新标记
        localStorage.setItem(LAST_SEEN_KEY, latest);
        localStorage.setItem(LS_LAST_REFRESH, String(now));

        // 6. v130 强化：无论首次还是升级，只要 lastSeen 与 latest 不一致就强制刷新
        //    （首次访问 lastSeen=null，跳过 reload，让浏览器直接拿最新 ?v=130 文件）
        if (lastSeen && lastSeen !== latest) {
          if (window.__PANIC_SYNC__) {
            console.warn('[VersionProbe] 刷新风暴中，跳过强制刷新避免死循环');
          } else {
            console.log('[VersionProbe] 检测到版本升级 ' + lastSeen + ' → ' + latest + '，强制刷新');
            location.reload();
          }
        }
      } catch (e) {
        console.warn('[VersionProbe] 探针异常（非致命）:', e.message);
      }
    })();
  </script>

  <!-- Supabase 配置 + SDK + 客户端 -->
  <script src="supabase/config.js?v=154"></script>

  <script>
    // ===== Auth Module (v142: 兼容旧 Auth + 新 AuthHelper) =====
    const Auth = {
      _data: null,
      async init() {
        // 优先用 AuthHelper（Supabase）
        if (typeof AuthHelper !== 'undefined') {
          const ok = await AuthHelper.init();
          if (ok) {
            const u = AuthHelper.getCurrentUser();
            this._data = {
              role: u.role,
              staffId: u.staffId,
              staffName: u.staffName,
              dept: u.dept,
              authenticated: true
            };
            return true;
          }
          return false;
        }
        // 降级：旧版 sessionStorage
        const raw = sessionStorage.getItem('auth');
        if (!raw) { window.location.href = 'login.html'; return false; }
        this._data = JSON.parse(raw);
        return true;
      },
      get role() { return this._data?.role || null; },
      get staffId() { return this._data?.staffId; },
      get staffName() { return this._data?.staffName; },
      get dept() { return this._data?.dept; },
      get isAdmin() { return this._data?.role === 'admin' || this._data?.role === 'manager'; },
      logout() {
        if (typeof AuthHelper !== 'undefined') { AuthHelper.logout(); return; }
        sessionStorage.removeItem('auth');
        window.location.href = 'login.html';
      }
    };

    // 启动认证检查（异步）
    (async () => {
      if (!await Auth.init()) return;

    // Show user banner
    const banner = document.getElementById('userBanner');
    banner.style.display = 'flex';
    const staffObj = Auth.staffId ? Store.get('staff').find(s => s.id === Auth.staffId) : null;
    const avatarColor = staffObj?.avatar_color || '#1a1a2e';
    const displayName = Auth.staffName || '管理员';
    const displayDept = Auth.dept || 'Admin';
    const initial = displayName[0];
    banner.innerHTML = `
      <div class="user-avatar" style="background:${avatarColor};">${initial}</div>
      <span class="user-name">${displayName}</span>
      <span class="user-role">${displayDept}</span>
      <span id="syncIndicator" style="font-size:11px;margin-left:8px;opacity:0.7;cursor:default;" title="云端同步状态 · 右键配置Token">
        <span id="syncDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#9ca3af;margin-right:3px;"></span>
        <span id="syncLabel">--</span>
      </span>
      <button id="syncBtn" onclick="Sync.manualSync()" style="font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-secondary);color:var(--text-primary);cursor:pointer;margin-left:4px;transition:all 0.2s;" title="点击上传本地数据并拉取最新" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">🔄 同步</button>
      <button class="btn-logout" style="border-color:var(--accent);color:var(--accent);" onclick="openChangePasswordModal(false)">修改密码</button>
      <button class="btn-logout" onclick="Auth.logout()">退出登录</button>
    `;

    // Set current date
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${['日','一','二','三','四','五','六'][now.getDay()]}`;
    document.getElementById('currentDate').textContent = dateStr;

    // Update sidebar badges
    function updateBadges() {
      const staffCount = Store.get('staff').filter(s => s.status === 'active').length;
      document.getElementById('staffCount').textContent = staffCount;
    }
    updateBadges();

    // Initialize app
    Router.render();

    // Override Router.render to update badges
    const originalRender = Router.render.bind(Router);
    Router.render = function() {
      originalRender();
      updateBadges();
    };
    })(); // end async IIFE
  </script>
