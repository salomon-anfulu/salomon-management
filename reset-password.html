<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self'">
  <title>重置密码 - 安福路 Salomon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a1a2e;
      --accent: #e94560;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --success: #10b981;
      --error: #e94560;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-header {
      background: linear-gradient(135deg, #1a1a2e, #2d2d4a);
      padding: 36px 28px 28px;
      text-align: center;
    }
    .brand-title { color: #fff; font-size: 22px; font-weight: 700; }
    .brand-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }
    .login-body { padding: 36px 28px 32px; text-align: center; }
    .welcome-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .input-group input {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 15px; background: var(--bg); color: var(--text-primary); transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1); }
    .btn-login {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #c0392b);
      color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; letter-spacing: 1px;
    }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .login-msg.error { color: var(--error); }
    .login-msg.success { color: var(--success); }
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="brand-title">🔑 重置密码</div>
      <div class="brand-sub">Salomon 安福路兼职平台</div>
    </div>
    <div class="login-body">
      <div id="rpStatus" class="welcome-text">正在验证重置链接…</div>
      <div id="rpForm" style="display:none;">
        <div class="input-group">
          <label>🔑 新密码</label>
          <input type="password" id="newPw" placeholder="至少 6 位" autocomplete="new-password" />
        </div>
        <div class="input-group">
          <label>🔑 确认新密码</label>
          <input type="password" id="newPw2" placeholder="再次输入" autocomplete="new-password" />
        </div>
        <button class="btn-login" id="btnReset" onclick="doResetPassword()">重 置 密 码</button>
        <div class="login-msg" id="rpMsg"></div>
      </div>
      <div id="rpBack" style="display:none; margin-top:16px;">
        <a href="login.html" style="font-size:13px; color:var(--text-secondary); text-decoration:none; border-bottom:1px dashed var(--border);">← 返回登录页</a>
      </div>
    </div>
  </div>

  <script src="supabase/config.js?v=182"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=182"></script>
  <script>
    // Supabase 把重置 token 放在 URL hash 中（#access_token=...）
    (async function verifyResetLink() {
      const statusEl = document.getElementById('rpStatus');
      const formEl = document.getElementById('rpForm');
      const backEl = document.getElementById('rpBack');
      const hash = window.location.hash || '';
      if (!hash.includes('access_token')) {
        statusEl.innerHTML = '⚠️ 链接无效或已过期。<br>请在登录页点击「忘记密码」重新申请，或联系管理员手动重置。';
        backEl.style.display = 'block';
        return;
      }
      try {
        const { data, error } = await salomonSupabase.client.auth.getSession();
        if (error) throw error;
        if (!data.session) {
          statusEl.innerHTML = '⚠️ 会话已失效，请重新申请重置。';
          backEl.style.display = 'block';
          return;
        }
        statusEl.style.display = 'none';
        formEl.style.display = 'block';
      } catch (e) {
        statusEl.innerHTML = '⚠️ 验证失败：' + (e.message || '') + '<br>请重新申请重置。';
        backEl.style.display = 'block';
      }
    })();

    async function doResetPassword() {
      const pw = document.getElementById('newPw').value;
      const pw2 = document.getElementById('newPw2').value;
      const btn = document.getElementById('btnReset');
      const msg = document.getElementById('rpMsg');
      if (pw.length < 6) { msg.className = 'login-msg error'; msg.textContent = '密码至少 6 位'; return; }
      if (pw !== pw2) { msg.className = 'login-msg error'; msg.textContent = '两次输入的密码不一致'; return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>重置中...';
      try {
        const { error } = await salomonSupabase.client.auth.updateUser({ password: pw });
        if (error) throw error;
        msg.className = 'login-msg success';
        msg.textContent = '✅ 密码已重置！正在跳转登录…';
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '重 置 密 码';
        msg.className = 'login-msg error';
        msg.textContent = '❌ ' + (e.message || '重置失败');
      }
    }
  </script>
</body>
</html>
